name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  # The branch ruleset requires a check named "Test"; this job reports the
  # matrix result under that name so the ruleset does not track matrix entries.
  test-result:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: test "${{ needs.test.result }}" = success
